name: Build

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build (beta)
        if: github.ref == 'refs/heads/beta'
        run: npm run build:beta
      - name: Build (production)
        if: github.ref != 'refs/heads/beta'
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
